  <text x="400" y="42" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace">solid=[OBSERVED] · dashed=[INFERRED] · red-dashed=[MISSING]  ·  IDs: M-01 M-03 M-06 M-07 M-08 M-09</text>

  <!-- ── MICRO LANE ── -->
  <rect x="8" y="52" width="784" height="110" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
