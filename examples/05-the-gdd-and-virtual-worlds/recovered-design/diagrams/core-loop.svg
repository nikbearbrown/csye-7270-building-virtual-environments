  <rect x="160" y="316" width="100" height="34" rx="4" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="210" y="338" text-anchor="middle" fill="#C4B5FD" font-size="11" font-family="monospace">EXPLORE</text>

  <rect x="316" y="316" width="128" height="34" rx="4" fill="#431407" stroke="#F97316" stroke-width="1.5"/>
  <text x="380" y="330" text-anchor="middle" fill="#FED7AA" font-size="10" font-family="monospace">FALL y&lt;-12</text>
