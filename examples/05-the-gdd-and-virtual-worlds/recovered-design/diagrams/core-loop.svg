  <text x="400" y="280" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">[INFERRED] no ordered gate — level is open, all areas reachable from spawn</text>

  <!-- ── SESSION LANE ── -->
  <rect x="8" y="292" width="784" height="120" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="18" y="308" fill="#8B5CF6" font-size="10" font-family="monospace" font-weight="bold">SESSION  [MISSING win state — see OQ-01 in decisions.md]</text>

