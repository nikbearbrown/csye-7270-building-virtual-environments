  <text x="530" y="223" text-anchor="middle" fill="#86EFAC" font-size="9" font-family="monospace">4 fixed positions</text>

  <rect x="626" y="194" width="114" height="34" rx="4" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
  <text x="683" y="216" text-anchor="middle" fill="#86EFAC" font-size="10" font-family="monospace">NEXT AREA</text>

  <line x1="126"  y1="211" x2="169"  y2="211" stroke="#22C55E" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="272"  y1="211" x2="315"  y2="211" stroke="#22C55E" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="432"  y1="211" x2="477"  y2="211" stroke="#22C55E" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="580"  y1="211" x2="623"  y2="211" stroke="#22C55E" stroke-width="1.5" marker-end="url(#aG)"/>
