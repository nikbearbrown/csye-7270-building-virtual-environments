  <path d="M 380 350 Q 380 390 190 390 Q 65 390 65 350" fill="none" stroke="#F97316" stroke-width="1.5" marker-end="url(#aO)"/>
  <text x="225" y="403" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">reset → initial_position  [OBSERVED player.gd:36-43]</text>

  <!-- legend -->
  <text x="20"  y="468" fill="#475569" font-size="9" font-family="monospace">—— [OBSERVED]   - - [INFERRED]   - - ⚠ [MISSING]</text>
