  <text x="568" y="344" text-anchor="middle" fill="#FCA5A5" font-size="10" font-family="monospace">[MISSING] — no trigger</text>

  <text x="680" y="333" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">⚠ no win</text>
  <text x="680" y="345" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">condition</text>

  <line x1="110"  y1="333" x2="157"  y2="333" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#aP)"/>
  <line x1="260"  y1="333" x2="313"  y2="333" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#aP)"/>
  <line x1="444"  y1="333" x2="495"  y2="333" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aR)"/>
