  <text x="515" y="98" text-anchor="middle" fill="#93C5FD" font-size="11" font-family="monospace">COLLECT/ELIM</text>

  <rect x="624" y="76" width="110" height="34" rx="4" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="679" y="98" text-anchor="middle" fill="#93C5FD" font-size="11" font-family="monospace">REPOSITION</text>

  <line x1="116"  y1="93" x2="155"  y2="93" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="254"  y1="93" x2="297"  y2="93" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="410"  y1="93" x2="457"  y2="93" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="570"  y1="93" x2="621"  y2="93" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#aB)"/>
