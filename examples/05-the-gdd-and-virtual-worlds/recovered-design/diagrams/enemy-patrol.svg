<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" width="580" height="360">
  <defs>
    <marker id="aO" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F97316"/></marker>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#EF4444"/></marker>
    <marker id="aS" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
  </defs>

  <rect width="580" height="360" fill="#0F172A"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" fill="#F1F5F9" font-size="14" font-family="monospace" font-weight="bold">Enemy Patrol State Machine — M-08 M-09</text>
  <text x="290" y="40" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace">4 instances · RigidBody3D · [OBSERVED enemy.gd]</text>

  <!-- ── PATROL outer box ── -->
  <rect x="20" y="52" width="540" height="180" rx="8" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
  <text x="290" y="70" text-anchor="middle" fill="#F97316" font-size="12" font-family="monospace" font-weight="bold">PATROL</text>
  <text x="290" y="84" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">dying = false · evaluated in _integrate_forces() each physics tick</text>
  <line x1="20" y1="89" x2="560" y2="89" stroke="#334155" stroke-width="1"/>

  <!-- ADVANCE sub-state -->
  <rect x="40" y="100" width="210" height="118" rx="6" fill="#431407" stroke="#F97316" stroke-width="1.5"/>
  <text x="145" y="118" text-anchor="middle" fill="#FED7AA" font-size="11" font-family="monospace" font-weight="bold">ADVANCE</text>
  <line x1="40" y1="122" x2="250" y2="122" stroke="#6B3000" stroke-width="1"/>
  <text x="56" y="140" fill="#FED7AA" font-size="10" font-family="monospace">condition:</text>
  <text x="56" y="154" fill="#FCA5A5" font-size="10" font-family="monospace">_ray_floor.is_colliding()</text>
  <text x="56" y="168" fill="#FCA5A5" font-size="10" font-family="monospace">AND NOT _ray_wall</text>
  <text x="56" y="186" fill="#FED7AA" font-size="10" font-family="monospace">ACCEL = 5 m/s²</text>
  <text x="56" y="200" fill="#FED7AA" font-size="10" font-family="monospace">MAX_SPEED = 2.0 m/s</text>
  <text x="56" y="214" fill="#FED7AA" font-size="10" font-family="monospace">decel on side axis 20 m/s²</text>

  <!-- TURN sub-state -->
  <rect x="330" y="100" width="210" height="118" rx="6" fill="#292524" stroke="#78716C" stroke-width="1.5"/>
  <text x="435" y="118" text-anchor="middle" fill="#D6D3D1" font-size="11" font-family="monospace" font-weight="bold">TURN</text>
  <line x1="330" y1="122" x2="540" y2="122" stroke="#44403C" stroke-width="1"/>
  <text x="346" y="140" fill="#D6D3D1" font-size="10" font-family="monospace">condition:</text>
  <text x="346" y="154" fill="#FCA5A5" font-size="10" font-family="monospace">NOT floor OR wall blocked</text>
  <text x="346" y="170" fill="#D6D3D1" font-size="10" font-family="monospace">ROT_SPEED = 1.0 rad/s</text>
  <text x="346" y="184" fill="#D6D3D1" font-size="10" font-family="monospace">rot_dir: init 4.0</text>
  <text x="346" y="198" fill="#D6D3D1" font-size="10" font-family="monospace">→ resets to 1.0 on</text>
  <text x="346" y="212" fill="#D6D3D1" font-size="10" font-family="monospace">  first advance→turn</text>

  <!-- ADVANCE ↔ TURN arrows -->
  <path d="M 250 145 Q 290 136 330 145" fill="none" stroke="#F97316" stroke-width="1.5" marker-end="url(#aO)"/>
  <text x="290" y="132" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="monospace">wall / ledge</text>

  <path d="M 330 165 Q 290 174 250 165" fill="none" stroke="#78716C" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="290" y="182" text-anchor="middle" fill="#78716C" font-size="9" font-family="monospace">floor clears, no wall</text>

  <!-- ── DYING STATE ── -->
  <rect x="20" y="252" width="360" height="78" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
  <text x="200" y="270" text-anchor="middle" fill="#EF4444" font-size="12" font-family="monospace" font-weight="bold">DYING</text>
  <line x1="20" y1="274" x2="380" y2="274" stroke="#6B1515" stroke-width="1"/>
  <text x="36" y="292" fill="#FCA5A5" font-size="10" font-family="monospace">dying = true · collision_layer = 0</text>
  <text x="36" y="308" fill="#FCA5A5" font-size="10" font-family="monospace">axes unlocked · angular spin × 33</text>
  <text x="36" y="322" fill="#FCA5A5" font-size="10" font-family="monospace">anim: impact → extra/explode</text>

  <!-- PATROL → DYING arrow -->
  <line x1="200" y1="232" x2="200" y2="250" stroke="#EF4444" stroke-width="2" marker-end="url(#aR)"/>
  <text x="210" y="244" fill="#FCA5A5" font-size="9" font-family="monospace">bullet.enabled contact  [OBSERVED enemy.gd:34-47]</text>

  <!-- ── REMOVED ── -->
  <rect x="430" y="252" width="130" height="78" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="495" y="270" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="monospace" font-weight="bold">REMOVED</text>
  <line x1="430" y1="274" x2="560" y2="274" stroke="#334155" stroke-width="1"/>
  <text x="495" y="294" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace">queue_free()</text>
  <text x="495" y="310" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">via _die() signal</text>
  <text x="495" y="324" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">[OBSERVED enemy.gd:77]</text>

  <!-- DYING → REMOVED arrow -->
  <line x1="380" y1="291" x2="428" y2="291" stroke="#64748B" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="404" y="285" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">anim end</text>

  <!-- legend + footer -->
  <text x="20"  y="350" fill="#334155" font-size="9" font-family="monospace">—— [OBSERVED]</text>
  <text x="560" y="350" text-anchor="end" fill="#334155" font-size="9" font-family="monospace">design/diagrams/enemy-patrol.svg · rev 1</text>
</svg>
