<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <defs>
    <marker id="aB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
    <marker id="aO" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F97316"/></marker>
    <marker id="aY" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#EAB308"/></marker>
    <marker id="aS" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94A3B8"/></marker>
  </defs>

  <rect width="680" height="420" fill="#0F172A"/>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#F1F5F9" font-size="14" font-family="monospace" font-weight="bold">Player State Machine — M-01 M-02 M-03 M-05 M-06</text>
  <text x="340" y="40" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace">solid=[OBSERVED]   [OBSERVED player.gd]</text>

  <!-- ── FLOOR STATE ── -->
  <rect x="30" y="56" width="260" height="180" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  <text x="160" y="74" text-anchor="middle" fill="#22C55E" font-size="13" font-family="monospace" font-weight="bold">FLOOR</text>
  <text x="160" y="88" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">is_on_floor() = true</text>
  <line x1="30" y1="93" x2="290" y2="93" stroke="#334155" stroke-width="1"/>

  <text x="46" y="112" fill="#86EFAC" font-size="10" font-family="monospace">ACCEL / DEACCEL  = 14 m/s²</text>
  <text x="46" y="128" fill="#86EFAC" font-size="10" font-family="monospace">MAX_SPEED        = 6.0 m/s</text>
  <text x="46" y="144" fill="#86EFAC" font-size="10" font-family="monospace">TURN_SPEED       = 40</text>
  <text x="46" y="160" fill="#86EFAC" font-size="10" font-family="monospace">sharp turn &gt;140° → stop accel</text>
  <text x="46" y="176" fill="#86EFAC" font-size="10" font-family="monospace">mesh arc rotation via adjust_facing</text>
  <text x="46" y="196" fill="#93C5FD" font-size="10" font-family="monospace">anim: run·speed blend</text>
  <text x="46" y="212" fill="#93C5FD" font-size="10" font-family="monospace">jump → JUMP_VEL = 12.5 m/s</text>

  <!-- ── AIR STATE ── -->
  <rect x="390" y="56" width="260" height="180" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <text x="520" y="74" text-anchor="middle" fill="#3B82F6" font-size="13" font-family="monospace" font-weight="bold">AIR</text>
  <text x="520" y="88" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">is_on_floor() = false</text>
  <line x1="390" y1="93" x2="650" y2="93" stroke="#334155" stroke-width="1"/>

  <text x="406" y="112" fill="#93C5FD" font-size="10" font-family="monospace">AIR_ACCEL  = 7 m/s²  (0.5×)</text>
  <text x="406" y="128" fill="#93C5FD" font-size="10" font-family="monospace">AIR_IDLE_DEACCEL = false</text>
  <text x="406" y="144" fill="#93C5FD" font-size="10" font-family="monospace">speed cap = MAX_SPEED</text>
  <text x="406" y="160" fill="#93C5FD" font-size="10" font-family="monospace">jump cut → vel.y × 0.7</text>
  <text x="406" y="180" fill="#93C5FD" font-size="10" font-family="monospace">anim: air_dir blend</text>
  <text x="406" y="196" fill="#64748B" font-size="10" font-family="monospace">jump: 1.53 m (6t) / 3.60 m (60t)</text>
  <text x="406" y="212" fill="#64748B" font-size="9" font-family="monospace">[OBSERVED evidence/baseline-probe.json]</text>

  <!-- Transition arrows: FLOOR → AIR -->
  <path d="M 290 118 Q 340 110 390 118" fill="none" stroke="#22C55E" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="340" y="106" text-anchor="middle" fill="#86EFAC" font-size="9" font-family="monospace">jump / leave floor</text>

  <!-- Transition arrows: AIR → FLOOR -->
  <path d="M 390 148 Q 340 156 290 148" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="340" y="166" text-anchor="middle" fill="#93C5FD" font-size="9" font-family="monospace">land (is_on_floor)</text>

  <!-- ── GLOBAL TRANSITIONS ── -->
  <rect x="30" y="258" width="600" height="80" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="330" y="274" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="bold">Global transitions — from either state</text>

  <!-- Shoot -->
  <rect x="50"  y="284" width="140" height="42" rx="4" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="120" y="299" text-anchor="middle" fill="#A5B4FC" font-size="10" font-family="monospace">SHOOT (press-edge)</text>
  <text x="120" y="313" text-anchor="middle" fill="#A5B4FC" font-size="9" font-family="monospace">→ spawn Bullet RigidBody3D</text>
  <text x="120" y="323" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">[OBSERVED player.gd:153-165]</text>

  <!-- Reset -->
  <rect x="226" y="284" width="180" height="42" rx="4" fill="#431407" stroke="#F97316" stroke-width="1.5"/>
  <text x="316" y="299" text-anchor="middle" fill="#FED7AA" font-size="10" font-family="monospace">RESET (R or y&lt;-12)</text>
  <text x="316" y="313" text-anchor="middle" fill="#FED7AA" font-size="9" font-family="monospace">→ initial_position, vel=ZERO</text>
  <text x="316" y="323" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">[OBSERVED player.gd:36-43]</text>

  <!-- Jump cut -->
  <rect x="432" y="284" width="170" height="42" rx="4" fill="#1E1035" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="517" y="299" text-anchor="middle" fill="#C4B5FD" font-size="10" font-family="monospace">JUMP CUT (AIR only)</text>
  <text x="517" y="313" text-anchor="middle" fill="#C4B5FD" font-size="9" font-family="monospace">release jump → vel.y × 0.7</text>
  <text x="517" y="323" text-anchor="middle" fill="#64748B" font-size="9" font-family="monospace">[OBSERVED player.gd:135-137]</text>

  <!-- ANIMATION TREE legend -->
  <rect x="30" y="354" width="600" height="52" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="340" y="370" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace" font-weight="bold">AnimationTree parameters  [OBSERVED player.gd:168-176]</text>
  <text x="46"  y="386" fill="#475569" font-size="9" font-family="monospace">state/blend_amount: 0=FLOOR 1=AIR</text>
  <text x="46"  y="398" fill="#475569" font-size="9" font-family="monospace">run/blend · speed/blend · air_dir/blend · gun/blend</text>
  <text x="400" y="386" fill="#475569" font-size="9" font-family="monospace">gun/blend: 0=holstered 1=raised (SHOOT_TIME=1.5)</text>
  <text x="400" y="398" fill="#475569" font-size="9" font-family="monospace">air_dir/blend: 0=falling 1=rising</text>

  <!-- footer -->
  <text x="20"  y="416" fill="#334155" font-size="9" font-family="monospace">—— [OBSERVED]</text>
  <text x="660" y="416" text-anchor="end" fill="#334155" font-size="9" font-family="monospace">design/diagrams/player-state-machine.svg · rev 1</text>
</svg>
